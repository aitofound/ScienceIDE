# @NAME@ — generated by envs/athena-gr from pinned SAB GR checks.
schema_version = "1.4"

[task]
name = "sciaccel/@NAME@"
description = "@DESCRIPTION@"

[metadata.provenance]
derived_from = "ScienceAccelBench athena-general-relativity official shock decks and check matrix; native calibration in sciaccel-rl"
upstream_repo = "https://github.com/PrincetonUniversity/athena"
upstream_commit = "@ATHENA_COMMIT@"
upstream_license = "BSD-3-Clause"
source_archive_sha256 = "@ATHENA_SHA256@"

[metadata.taxonomy]
category = "@CATEGORY@"
mode = "@MODE@"
family = "@FAMILY@"
tree = "@TREE@"
affected_checks = @CHECKS_TOML@
defect_file = "@DEFECT_FILE@"
floor_native_estimate = @FLOOR@
canary = "@CANARY@"
difficulty = "unrated"
difficulty_basis = "none"
difficulty_design = "@DIFFICULTY_DESIGN@"
predicted_tier = "@PREDICTED_TIER@"
# Memorization note: Athena++ at this commit is public. Public-source recall
# is a curriculum confound; empirical probe difficulty is filed separately.

[environment]
cpus = 4
memory_mb = @MEM@
build_timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["*.chatgpt.com", "*.debian.org", "*.googleapis.com", "*.nodejs.org", "*.npmjs.com", "*.npmjs.org", "*.oaistatic.com", "*.ubuntu.com", "aiplatform.googleapis.com", "api.anthropic.com", "api.getabacus.dev", "api.openai.com", "archive.ubuntu.com", "auth.openai.com", "chatgpt.com", "claude.ai", "deb.debian.org", "downloads.claude.ai", "files.pythonhosted.org", "github.com", "nodejs.org", "oauth2.googleapis.com", "objects.githubusercontent.com", "pypi.org", "raw.githubusercontent.com", "registry.npmjs.org", "security.debian.org", "security.ubuntu.com", "sentry.io", "statsig.anthropic.com"]

[agent]
timeout_sec = @AGENT_TIMEOUT@
network_mode = "allowlist"
allowed_hosts = ["*.chatgpt.com", "*.googleapis.com", "*.oaistatic.com", "aiplatform.googleapis.com", "api.anthropic.com", "api.getabacus.dev", "api.openai.com", "auth.openai.com", "chatgpt.com", "oauth2.googleapis.com", "sentry.io", "statsig.anthropic.com"]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = @MEM@
build_timeout_sec = @VERIFIER_BUILD_TIMEOUT@
network_mode = "no-network"
