difficulty_design = "@DIFFICULTY_DESIGN@"
predicted_tier = "@PREDICTED_TIER@"
prediction_rationale = "@PREDICTION_RATIONALE@"

[environment]
cpus = 4
memory_mb = 8192
build_timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["*.chatgpt.com", "*.debian.org", "*.googleapis.com", "*.nodejs.org", "*.npmjs.com", "*.npmjs.org", "*.oaistatic.com", "*.ubuntu.com", "aiplatform.googleapis.com", "api.anthropic.com", "api.getabacus.dev", "api.openai.com", "archive.ubuntu.com", "auth.openai.com", "chatgpt.com", "claude.ai", "deb.debian.org", "downloads.claude.ai", "files.pythonhosted.org", "github.com", "nodejs.org", "oauth2.googleapis.com", "objects.githubusercontent.com", "pypi.org", "raw.githubusercontent.com", "registry.npmjs.org", "security.debian.org", "security.ubuntu.com", "sentry.io", "statsig.anthropic.com"]

[agent]
timeout_sec = @AGENT_TIMEOUT@
network_mode = "allowlist"
allowed_hosts = ["*.chatgpt.com", "*.googleapis.com", "*.oaistatic.com", "aiplatform.googleapis.com", "api.anthropic.com", "api.getabacus.dev", "api.openai.com", "auth.openai.com", "chatgpt.com", "oauth2.googleapis.com", "sentry.io", "statsig.anthropic.com"]

[verifier]
