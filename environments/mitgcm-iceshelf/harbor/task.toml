# @NAME@ — generated from the pinned ScienceAccelBench MITgcm leaf.
schema_version = "1.4"

[task]
name = "sciaccel/@NAME@"
description = "@DESCRIPTION@"

[metadata.provenance]
derived_from = "ScienceAccelBench tasks/mitgcm/mitgcm-ice-shelf-and-ice-stream official checks; native repair-factory calibration"
upstream_repo = "https://github.com/MITgcm/MITgcm"
upstream_commit = "@MITGCM_COMMIT@"
upstream_release = "checkpoint69q"
upstream_license = "MIT"
source_archive_sha256 = "@MITGCM_SHA256@"

[metadata.taxonomy]
category = "@CATEGORY@"
mode = "@MODE@"
family = "@FAMILY@"
tree = "@TREE@"
affected_checks = @CHECKS_TOML@
defect_file = "@DEFECT_FILE@"
floor_native_estimate = @FLOOR@
straw_timeout_sec = @STRAW_TIMEOUT@
canary = "@CANARY@"
difficulty = "unrated"
