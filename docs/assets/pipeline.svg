<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker></defs>
  <style>.box{fill:#f4f7fb;stroke:#3b6ea5;stroke-width:2;rx:10} .t{font-size:15px;fill:#1c2b3a;font-weight:600} .s{font-size:12px;fill:#3a4a5a} .g{fill:#fff3e6;stroke:#c97b2a}</style>
  <rect class="box" x="20" y="60" width="200" height="120"/><text class="t" x="120" y="90" text-anchor="middle">1. Real science code</text><text class="s" x="120" y="115" text-anchor="middle">pinned upstream commit</text><text class="s" x="120" y="135" text-anchor="middle">official test cases as checks</text><text class="s" x="120" y="155" text-anchor="middle">64 environments, 26 codes</text>
  <rect class="box" x="260" y="60" width="200" height="120"/><text class="t" x="360" y="90" text-anchor="middle">2. Propose a task</text><text class="s" x="360" y="115" text-anchor="middle">inject a defect / excise a routine</text><text class="s" x="360" y="135" text-anchor="middle">reference fix = exact inverse</text><text class="s" x="360" y="155" text-anchor="middle">design probes, no model grading</text>
  <rect class="box" x="500" y="60" width="200" height="120"/><text class="t" x="600" y="90" text-anchor="middle">3. Execute to validate</text><text class="s" x="600" y="115" text-anchor="middle">oracle must score 1.0</text><text class="s" x="600" y="135" text-anchor="middle">unfixed floor must be &lt; 0.65</text><text class="s" x="600" y="155" text-anchor="middle">in the grading container</text>
  <rect class="box" x="740" y="60" width="200" height="120"/><text class="t" x="840" y="90" text-anchor="middle">4. Deterministic gates</text><text class="s" x="840" y="115" text-anchor="middle">no answer leaks in the image</text><text class="s" x="840" y="135" text-anchor="middle">instruction discloses nothing</text><text class="s" x="840" y="155" text-anchor="middle">schema, duplicates, resources</text>
  <rect class="box" x="980" y="60" width="180" height="120"/><text class="t" x="1070" y="90" text-anchor="middle">5. Release</text><text class="s" x="1070" y="115" text-anchor="middle">difficulty = facts,</text><text class="s" x="1070" y="135" text-anchor="middle">not a hand label</text><text class="s" x="1070" y="155" text-anchor="middle">+ measured pass rates</text>
  <line x1="220" y1="120" x2="258" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="460" y1="120" x2="498" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="700" y1="120" x2="738" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/><line x1="940" y1="120" x2="978" y2="120" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <rect class="box g" x="500" y="215" width="440" height="60"/><text class="t" x="720" y="240" text-anchor="middle">Graveyard</text><text class="s" x="720" y="262" text-anchor="middle">every rejected task is kept with its evidence and the lesson it taught the pipeline</text>
  <line x1="600" y1="180" x2="600" y2="213" stroke="#c97b2a" stroke-width="2" marker-end="url(#a)"/><line x1="840" y1="180" x2="840" y2="213" stroke="#c97b2a" stroke-width="2" marker-end="url(#a)"/>
</svg>
